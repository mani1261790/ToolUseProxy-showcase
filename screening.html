<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>ToolUseProxy 展示デモ</title>
<style>
html,body{margin:0;background:#000;color:#eee;height:100%;font:16px system-ui,sans-serif}body{display:grid;place-items:center}video{width:100%;height:100%;object-fit:contain}nav{position:fixed;right:18px;top:16px;display:flex;gap:10px;opacity:0;transition:opacity .2s}body:hover nav,nav:focus-within,body.paused nav{opacity:1}button{border:1px solid #666;border-radius:6px;background:#171d20;color:#fff;font:inherit;padding:9px 15px;cursor:pointer}@media(pointer:coarse){nav{opacity:1}}
</style>
<video id="movie" src="demo.mp4" controls autoplay loop muted playsinline preload="auto" aria-label="ToolUseProxyの紹介と3種類のファイルの送信実験"></video>
<nav><button id="restart">最初から</button><button id="fullscreen">全画面</button></nav>
<script>
const movie=document.getElementById('movie');
document.getElementById('restart').onclick=()=>{movie.currentTime=0;movie.play()};
document.getElementById('fullscreen').onclick=()=>{if(movie.requestFullscreen)movie.requestFullscreen();else if(movie.webkitEnterFullscreen)movie.webkitEnterFullscreen()};
movie.addEventListener('pause',()=>document.body.classList.add('paused'));
movie.addEventListener('play',()=>document.body.classList.remove('paused'));
movie.play().catch(()=>document.body.classList.add('paused'));
</script>
</html>
